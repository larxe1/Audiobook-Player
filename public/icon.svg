<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Audiobook Player">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="52%">
      <stop offset="0%" stop-color="#1ed760" stop-opacity="0.22" />
      <stop offset="65%" stop-color="#1ed760" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#060911" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ee870" />
      <stop offset="100%" stop-color="#16b850" />
    </linearGradient>
  </defs>

  <!-- Full-bleed Midnight Black background for maskable & standard icons -->
  <rect width="512" height="512" rx="112" fill="#060911" />
  <rect width="512" height="512" rx="112" fill="url(#glow)" />

  <!-- Subtle inner rim -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#1ed760" stroke-opacity="0.16" stroke-width="2.5" />

  <!-- Headphones arc -->
  <path
    d="M124 274v-28c0-72.9 59.1-132 132-132s132 59.1 132 132v28"
    fill="none"
    stroke="url(#accent)"
    stroke-width="26"
    stroke-linecap="round"
  />

  <!-- Left & right ear cups -->
  <rect x="98" y="256" width="48" height="100" rx="24" fill="url(#accent)" />
  <rect x="366" y="256" width="48" height="100" rx="24" fill="url(#accent)" />

  <!-- Inner ear cushions -->
  <rect x="142" y="274" width="14" height="64" rx="7" fill="#060911" fill-opacity="0.45" />
  <rect x="356" y="274" width="14" height="64" rx="7" fill="#060911" fill-opacity="0.45" />

  <!-- Open audiobook pages -->
  <path
    d="M178 242c24-10 54-6 78 12 24-18 54-22 78-12v118c-24-10-54-6-78 12-24-18-54-22-78-12V242z"
    fill="#0d1322"
    stroke="#1ed760"
    stroke-width="14"
    stroke-linejoin="round"
  />
  <path d="M256 254v118" stroke="#1ed760" stroke-width="10" stroke-linecap="round" stroke-opacity="0.65" />

  <!-- Subtle audio wave / play accents on pages -->
  <path d="M204 282h26M204 312h26M282 282h26M282 312h26" stroke="#1ed760" stroke-width="10" stroke-linecap="round" stroke-opacity="0.75" />
</svg>
