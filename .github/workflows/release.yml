name: Deploy PWA & Release Multi-Platform Binaries

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-pages:
    name: Deploy Web / PWA to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run unit tests
        run: npm test

      - name: Stage static PWA site
        run: |
          mkdir -p _site
          cp index.html version.json oauth-callback.html _site/
          if [ -f sw.js ]; then cp sw.js _site/; fi
          cp -r public src _site/
          touch _site/.nojekyll

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-android-release:
    name: Build Android APK
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.changes.outputs.should_build }}
      version: ${{ steps.meta.outputs.version }}
      notes: ${{ steps.meta.outputs.notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if version.json changed
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || [ -z "${{ github.event.before }}" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif ! git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qx "version.json"; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.changes.outputs.should_build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21
        if: steps.changes.outputs.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run unit tests
        if: steps.changes.outputs.should_build == 'true'
        run: npm test

      - name: Prepare Capacitor Android project
        if: steps.changes.outputs.should_build == 'true'
        run: |
          mkdir -p dist
          cp index.html version.json oauth-callback.html dist/
          if [ -f sw.js ]; then cp sw.js dist/; fi
          cp -r public src dist/
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));c.webDir='dist';fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2));"
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android
          mkdir -p android/app/src/main/java/com/audiobook/player
          mkdir -p android/app/src/main/res/xml
          cp android-auto/AudiobookOAuthBridge.java android/app/src/main/java/com/audiobook/player/AudiobookOAuthBridge.java
          cp android-auto/AudiobookUpdaterBridge.java android/app/src/main/java/com/audiobook/player/AudiobookUpdaterBridge.java
          cp android-auto/res/xml/file_paths.xml android/app/src/main/res/xml/file_paths.xml
          node << 'EOF'
          const fs = require('fs');

          const versionMeta = JSON.parse(fs.readFileSync('version.json', 'utf8'));
          const buildCode = Number(versionMeta.build) || 1;
          const versionName = String(versionMeta.version || '1.0.0');

          // 1. Patch android/app/build.gradle: versionCode/versionName + androidx.browser:browser
          const gradlePath = 'android/app/build.gradle';
          let gradle = fs.readFileSync(gradlePath, 'utf8');
          if (!/\bversionCode\s+\d+/.test(gradle) || !/\bversionName\s+"[^"]*"/.test(gradle)) {
            throw new Error('Could not find versionCode/versionName in android/app/build.gradle');
          }
          gradle = gradle.replace(/\bversionCode\s+\d+/, `versionCode ${buildCode}`);
          gradle = gradle.replace(/\bversionName\s+"[^"]*"/, `versionName "${versionName}"`);

          if (!gradle.includes('androidx.browser:browser')) {
            if (!/dependencies\s*\{/.test(gradle)) {
              throw new Error('Could not find dependencies block in android/app/build.gradle');
            }
            gradle = gradle.replace(
              /dependencies\s*\{/,
              'dependencies {\n    implementation "androidx.browser:browser:1.8.0"'
            );
          }
          fs.writeFileSync(gradlePath, gradle);

          // 2. Patch MainActivity.java to register both AudiobookOAuthNative and AudiobookUpdaterNative
          const mainActivityPath = 'android/app/src/main/java/com/audiobook/player/MainActivity.java';
          const mainActivitySrc = `package com.audiobook.player;

          import android.content.Intent;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private AudiobookOAuthBridge oauthBridge;
              private AudiobookUpdaterBridge updaterBridge;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  oauthBridge = new AudiobookOAuthBridge(this);
                  updaterBridge = new AudiobookUpdaterBridge(this);
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      getBridge().getWebView().addJavascriptInterface(oauthBridge, "AudiobookOAuthNative");
                      getBridge().getWebView().addJavascriptInterface(updaterBridge, "AudiobookUpdaterNative");
                  }
                  oauthBridge.handleRedirectIntent(getIntent());
              }

              @Override
              public void onNewIntent(Intent intent) {
                  setIntent(intent);
                  super.onNewIntent(intent);
                  if (oauthBridge != null) {
                      oauthBridge.handleRedirectIntent(intent);
                  }
              }
          }
          `.replace(/^          /gm, '');
          fs.writeFileSync(mainActivityPath, mainActivitySrc);

          // 3. Patch AndroidManifest.xml: preserve 5 permissions, enforce singleTask, add OAuth deep-link + FileProvider
          const manifestPath = 'android/app/src/main/AndroidManifest.xml';
          let xml = fs.readFileSync(manifestPath, 'utf8');
          const perms = [
            'android.permission.WAKE_LOCK',
            'android.permission.FOREGROUND_SERVICE',
            'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK',
            'android.permission.POST_NOTIFICATIONS',
            'android.permission.REQUEST_INSTALL_PACKAGES'
          ];
          const addPerms = perms
            .filter((n) => !xml.includes(n))
            .map((n) => '    <uses-permission android:name="' + n + '" />')
            .join('\n');
          if (addPerms) {
            xml = xml.replace('<application', addPerms + '\n\n    <application');
          }

          const activityOpenRe = /<activity\b[^>]*\bandroid:name="(?:\.|com\.audiobook\.player\.)MainActivity"[^>]*>/;
          if (!activityOpenRe.test(xml)) {
            throw new Error('Could not find MainActivity <activity> tag in AndroidManifest.xml');
          }
          xml = xml.replace(activityOpenRe, (tag) => {
            if (/\bandroid:launchMode=/.test(tag)) {
              return tag.replace(/\bandroid:launchMode="[^"]*"/, 'android:launchMode="singleTask"');
            }
            return tag.replace(/>$/, ' android:launchMode="singleTask">');
          });

          if (!xml.includes('android:scheme="com.audiobook.player"')) {
            const oauthFilter = [
              '            <intent-filter>',
              '                <action android:name="android.intent.action.VIEW" />',
              '                <category android:name="android.intent.category.DEFAULT" />',
              '                <category android:name="android.intent.category.BROWSABLE" />',
              '                <data android:scheme="com.audiobook.player" android:host="oauth" />',
              '            </intent-filter>'
            ].join('\n');
            const activityBlockRe = /(<activity\b[^>]*\bandroid:name="(?:\.|com\.audiobook\.player\.)MainActivity"[^>]*>[\s\S]*?)(<\/activity>)/;
            if (!activityBlockRe.test(xml)) {
              throw new Error('Could not find closing </activity> for MainActivity in AndroidManifest.xml');
            }
            xml = xml.replace(activityBlockRe, `$1${oauthFilter}\n        $2`);
          }

          if (!xml.includes('androidx.core.content.FileProvider')) {
            const providerXml = [
              '        <provider',
              '            android:name="androidx.core.content.FileProvider"',
              '            android:authorities="${applicationId}.fileprovider"',
              '            android:exported="false"',
              '            android:grantUriPermissions="true">',
              '            <meta-data',
              '                android:name="android.support.FILE_PROVIDER_PATHS"',
              '                android:resource="@xml/file_paths" />',
              '        </provider>'
            ].join('\n');
            if (!xml.includes('</application>')) {
              throw new Error('Could not find </application> in AndroidManifest.xml');
            }
            xml = xml.replace('</application>', `${providerXml}\n    </application>`);
          }

          if (
            !xml.includes('android:launchMode="singleTask"') ||
            !xml.includes('android:scheme="com.audiobook.player"') ||
            !xml.includes('androidx.core.content.FileProvider')
          ) {
            throw new Error('AndroidManifest.xml patch verification failed');
          }
          fs.writeFileSync(manifestPath, xml);
          EOF

      - name: Build Android APK
        if: steps.changes.outputs.should_build == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks
            KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$PWD/app/release-keystore.jks" \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS"
            rm -f app/release-keystore.jks
            cd ..
            cp android/app/build/outputs/apk/release/app-release.apk Audiobook-Player.apk
          else
            ./gradlew assembleDebug
            cd ..
            cp android/app/build/outputs/apk/debug/app-debug.apk Audiobook-Player.apk
          fi

      - name: Read release metadata from version.json
        if: steps.changes.outputs.should_build == 'true'
        id: meta
        run: |
          node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync('version.json','utf8'));const notes=(v.releaseNotes||'Audiobook Player release');fs.appendFileSync(process.env.GITHUB_OUTPUT,'version='+v.version+'\nnotes<<GH_EOF\n'+notes+'\nGH_EOF\n');"

      - name: Upload APK workflow artifact
        if: steps.changes.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Audiobook-Player-apk
          path: Audiobook-Player.apk

  build-windows-release:
    name: Build Windows Desktop EXE
    runs-on: windows-latest
    outputs:
      should_build: ${{ steps.changes.outputs.should_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if version.json changed
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || [ -z "${{ github.event.before }}" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif ! git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qx "version.json"; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.changes.outputs.should_build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust toolchain
        if: steps.changes.outputs.should_build == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Run unit tests
        if: steps.changes.outputs.should_build == 'true'
        shell: bash
        run: npm test

      - name: Prepare Tauri UI assets
        if: steps.changes.outputs.should_build == 'true'
        shell: bash
        run: node scripts/prepare-tauri-ui.mjs

      - name: Build Windows Tauri release binary
        if: steps.changes.outputs.should_build == 'true'
        shell: bash
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml
          cp src-tauri/target/release/audiobook-player.exe Audiobook-Player.exe

      - name: Upload EXE workflow artifact
        if: steps.changes.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Audiobook-Player-exe
          path: Audiobook-Player.exe

  publish-release:
    name: Publish Multi-Platform GitHub Release
    needs: [build-android-release, build-windows-release]
    runs-on: ubuntu-latest
    if: needs.build-android-release.outputs.should_build == 'true'
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Audiobook-Player-apk
          path: release-assets

      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: Audiobook-Player-exe
          path: release-assets

      - name: Publish GitHub Release with APK and EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-android-release.outputs.version }}
          name: Audiobook Player v${{ needs.build-android-release.outputs.version }}
          body: ${{ needs.build-android-release.outputs.notes }}
          files: |
            release-assets/Audiobook-Player.apk
            release-assets/Audiobook-Player.exe
          make_latest: true
