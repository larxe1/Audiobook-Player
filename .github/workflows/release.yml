name: Deploy PWA & Release Multi-Platform Binaries

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-pages:
    name: Build Web / PWA for GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run unit tests
        run: npm test

      - name: Stage static PWA site
        run: |
          mkdir -p _site
          cp index.html version.json oauth-callback.html _site/
          if [ -f sw.js ]; then cp sw.js _site/; fi
          cp -r public src _site/
          touch _site/.nojekyll

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy-pages:
    name: Deploy Web / PWA to GitHub Pages
    needs: build-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  build-android-release:
    name: Build Android APK
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.changes.outputs.should_build }}
      version: ${{ steps.meta.outputs.version }}
      notes: ${{ steps.meta.outputs.notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if version.json changed
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || [ -z "${{ github.event.before }}" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif ! git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qx "version.json"; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.changes.outputs.should_build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21
        if: steps.changes.outputs.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run unit tests
        if: steps.changes.outputs.should_build == 'true'
        run: npm test

      - name: Prepare Capacitor Android project
        if: steps.changes.outputs.should_build == 'true'
        run: |
          mkdir -p dist
          cp index.html version.json oauth-callback.html dist/
          if [ -f sw.js ]; then cp sw.js dist/; fi
          cp -r public src dist/
          (cd dist && zip -r ../web-bundle.zip .)
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));c.webDir='dist';fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2));"
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          rm -f android/app/src/main/res/drawable/ic_launcher* android/app/src/main/res/drawable-v24/ic_launcher*
          if ! command -v convert >/dev/null 2>&1 && ! command -v magick >/dev/null 2>&1 && ! command -v ffmpeg >/dev/null 2>&1 && ! python3 -c "import PIL" >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil || true
          fi
          resize_icon() {
            local size="$1"
            local out="$2"
            if command -v convert >/dev/null 2>&1; then
              convert public/icon-512.png -resize "${size}x${size}!" "$out"
            elif command -v magick >/dev/null 2>&1; then
              magick public/icon-512.png -resize "${size}x${size}!" "$out"
            elif command -v ffmpeg >/dev/null 2>&1; then
              ffmpeg -y -loglevel error -i public/icon-512.png -vf "scale=${size}:${size}:flags=lanczos" "$out"
            elif python3 -c "import PIL" >/dev/null 2>&1; then
              python3 -c "from PIL import Image; resample = getattr(Image, 'Resampling', Image).LANCZOS; Image.open('public/icon-512.png').resize((${size},${size}), resample).save('${out}')"
            else
              cp public/icon-512.png "$out"
            fi
          }
          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"
            px="${spec##*:}"
            for dir in "android/app/src/main/res/mipmap-${density}" "android/app/src/main/res/mipmap-${density}-v4"; do
              if [ "$dir" = "android/app/src/main/res/mipmap-${density}" ] || [ -d "$dir" ]; then
                mkdir -p "$dir"
                resize_icon "$px" "${dir}/ic_launcher.png"
                cp "${dir}/ic_launcher.png" "${dir}/ic_launcher_round.png"
                cp "${dir}/ic_launcher.png" "${dir}/ic_launcher_foreground.png"
              fi
            done
          done
          mkdir -p android/app/src/main/java/com/audiobook/player
          mkdir -p android/app/src/main/res/xml
          cp android-auto/AudiobookOAuthBridge.java android/app/src/main/java/com/audiobook/player/AudiobookOAuthBridge.java
          cp android-auto/AudiobookUpdaterBridge.java android/app/src/main/java/com/audiobook/player/AudiobookUpdaterBridge.java
          cp android-auto/AudiobookMediaBrowserService.java android/app/src/main/java/com/audiobook/player/AudiobookMediaBrowserService.java
          cp android-auto/res/xml/file_paths.xml android/app/src/main/res/xml/file_paths.xml
          cp android-auto/res/xml/automotive_app_desc.xml android/app/src/main/res/xml/automotive_app_desc.xml
          node << 'EOF'
          const fs = require('fs');

          const versionMeta = JSON.parse(fs.readFileSync('version.json', 'utf8'));
          const buildCode = Number(versionMeta.build) || 1;
          const versionName = String(versionMeta.version || '1.0.0');

          // 1. Patch android/app/build.gradle: versionCode/versionName + androidx dependencies
          const gradlePath = 'android/app/build.gradle';
          let gradle = fs.readFileSync(gradlePath, 'utf8');
          if (!/\bversionCode\s+\d+/.test(gradle) || !/\bversionName\s+"[^"]*"/.test(gradle)) {
            throw new Error('Could not find versionCode/versionName in android/app/build.gradle');
          }
          gradle = gradle.replace(/\bversionCode\s+\d+/, `versionCode ${buildCode}`);
          gradle = gradle.replace(/\bversionName\s+"[^"]*"/, `versionName "${versionName}"`);

          const extraDeps = [
            ['androidx.browser:browser:', '    implementation "androidx.browser:browser:1.8.0"'],
            ['androidx.core:core:', '    implementation "androidx.core:core:1.13.1"'],
            ['androidx.media:media:', '    implementation "androidx.media:media:1.7.0"']
          ]
            .filter(([coord]) => !gradle.includes(coord))
            .map(([, line]) => line);
          if (extraDeps.length > 0) {
            if (!/dependencies\s*\{/.test(gradle)) {
              throw new Error('Could not find dependencies block in android/app/build.gradle');
            }
            gradle = gradle.replace(
              /dependencies\s*\{/,
              `dependencies {\n${extraDeps.join('\n')}`
            );
          }
          fs.writeFileSync(gradlePath, gradle);

          // 2. Patch MainActivity.java to register native bridges, configure dark system bars + safe insets, and boot newer Web OTA bundles
          const mainActivityPath = 'android/app/src/main/java/com/audiobook/player/MainActivity.java';
          const mainActivitySrc = `package com.audiobook.player;

          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.widget.Toast;
          import androidx.activity.OnBackPressedCallback;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;
          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.nio.charset.StandardCharsets;
          import org.json.JSONObject;

          public class MainActivity extends BridgeActivity {
              private AudiobookOAuthBridge oauthBridge;
              private AudiobookUpdaterBridge updaterBridge;
              private long lastBackExitPromptMs = 0L;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), true);
                  getWindow().setStatusBarColor(Color.parseColor("#000000"));
                  getWindow().setNavigationBarColor(Color.parseColor("#000000"));
                  WindowInsetsControllerCompat insetsController = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  if (insetsController != null) {
                      insetsController.setAppearanceLightStatusBars(false);
                      insetsController.setAppearanceLightNavigationBars(false);
                  }
                  View rootContent = findViewById(android.R.id.content);
                  if (rootContent != null) {
                      ViewCompat.setOnApplyWindowInsetsListener(rootContent, (v, windowInsets) -> {
                          Insets insets = windowInsets.getInsets(WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout());
                          v.setPadding(insets.left, insets.top, insets.right, insets.bottom);
                          return WindowInsetsCompat.CONSUMED;
                      });
                      ViewCompat.requestApplyInsets(rootContent);
                  }
                  oauthBridge = new AudiobookOAuthBridge(this);
                  updaterBridge = new AudiobookUpdaterBridge(this);
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      getBridge().getWebView().addJavascriptInterface(oauthBridge, "AudiobookOAuthNative");
                      getBridge().getWebView().addJavascriptInterface(updaterBridge, "AudiobookUpdaterNative");
                      getBridge().getWebView().addJavascriptInterface(new Object() {
                          @JavascriptInterface
                          public boolean hasNativeInsets() {
                              return true;
                          }
                      }, "AudiobookInsetsNative");
                      getBridge().getWebView().evaluateJavascript(
                          "window.__ANDROID_NATIVE_INSETS__ = true; if (document.documentElement) { document.documentElement.classList.add('has-native-insets'); document.documentElement.style.setProperty('--android-safe-top', '0px'); document.documentElement.style.setProperty('--android-safe-bottom', '0px'); }",
                          null
                      );
                  }
                  try {
                      File otaDir = new File(getFilesDir(), "ota-web");
                      File otaIndex = new File(otaDir, "index.html");
                      File otaVersion = new File(otaDir, "version.json");
                      if (otaIndex.isFile() && otaVersion.isFile()) {
                          int otaBuild = 0;
                          try (InputStream otaStream = new FileInputStream(otaVersion)) {
                              otaBuild = readBuildFromStream(otaStream);
                          }
                          int bundledBuild = 0;
                          try (InputStream bundledStream = getAssets().open("public/version.json")) {
                              bundledBuild = readBuildFromStream(bundledStream);
                          } catch (Exception ignored) {
                              bundledBuild = 0;
                          }
                          if (otaBuild > bundledBuild && getBridge() != null) {
                              if (getBridge().getWebView() != null) {
                                  getBridge().getWebView().clearCache(true);
                              }
                              getBridge().setServerBasePath(otaDir.getAbsolutePath());
                          } else if (bundledBuild >= otaBuild) {
                              deleteRecursive(otaDir);
                          }
                      }
                  } catch (Exception ignored) {
                  }
                  oauthBridge.handleRedirectIntent(getIntent());
                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          if (getBridge() != null && getBridge().getWebView() != null) {
                              final WebView wv = getBridge().getWebView();
                              wv.post(() -> {
                                  wv.evaluateJavascript(
                                      "(function(){ try { if (window.__audiobookApp && typeof window.__audiobookApp.handleBackPress === 'function') { return window.__audiobookApp.handleBackPress({ source: 'native' }) ? 'handled' : 'exit'; } return 'unready'; } catch(e) { return 'error'; } })()",
                                      value -> {
                                          if ("\\"exit\\"".equals(value)) {
                                              lastBackExitPromptMs = 0L;
                                              moveTaskToBack(true);
                                          } else if ("\\"unready\\"".equals(value)
                                              || "\\"error\\"".equals(value)
                                              || value == null
                                              || "null".equals(value)
                                              || "undefined".equals(value)) {
                                              handleNativeDoubleTapExit();
                                          }
                                      }
                                  );
                              });
                          } else {
                              handleNativeDoubleTapExit();
                          }
                      }
                  });
              }

              private void handleNativeDoubleTapExit() {
                  long now = System.currentTimeMillis();
                  if (now - lastBackExitPromptMs < 2500L) {
                      lastBackExitPromptMs = 0L;
                      moveTaskToBack(true);
                  } else {
                      lastBackExitPromptMs = now;
                      Toast.makeText(MainActivity.this, "Press back again to exit", Toast.LENGTH_SHORT).show();
                  }
              }

              private static int readBuildFromStream(InputStream stream) {
                  if (stream == null) return 0;
                  try (BufferedReader reader = new BufferedReader(new InputStreamReader(stream, StandardCharsets.UTF_8))) {
                      StringBuilder sb = new StringBuilder();
                      String line;
                      while ((line = reader.readLine()) != null) {
                          sb.append(line);
                      }
                      JSONObject json = new JSONObject(sb.toString());
                      return json.optInt("build", 0);
                  } catch (Exception ignored) {
                      return 0;
                  }
              }

              private static void deleteRecursive(File target) {
                  if (target == null || !target.exists()) return;
                  File[] children = target.listFiles();
                  if (children != null) {
                      for (File child : children) {
                          deleteRecursive(child);
                      }
                  }
                  target.delete();
              }

              @Override
              public void onNewIntent(Intent intent) {
                  setIntent(intent);
                  super.onNewIntent(intent);
                  if (oauthBridge != null) {
                      oauthBridge.handleRedirectIntent(intent);
                  }
              }
          }
          `.replace(/^          /gm, '');
          fs.writeFileSync(mainActivityPath, mainActivitySrc);

          // 2b. Patch styles.xml for dark status/navigation bars and Android 15 edge-to-edge opt-out
          const stylesPath = 'android/app/src/main/res/values/styles.xml';
          if (fs.existsSync(stylesPath)) {
            let stylesXml = fs.readFileSync(stylesPath, 'utf8');
            if (!stylesXml.includes('xmlns:tools=')) {
              stylesXml = stylesXml.replace('<resources', '<resources xmlns:tools="http://schemas.android.com/tools"');
            }
            const styleItems = [
              '        <item name="android:statusBarColor">#000000</item>',
              '        <item name="android:navigationBarColor">#000000</item>',
              '        <item name="android:windowOptOutEdgeToEdgeEnforcement" tools:targetApi="35">true</item>'
            ].join('\n');
            stylesXml = stylesXml.replace(
              /(<style\b[^>]*name="(?:AppTheme|AppTheme\.NoActionBar)"[^>]*>[\s\S]*?)(<\/style>)/g,
              (full, body, close) => {
                if (body.includes('windowOptOutEdgeToEdgeEnforcement')) return full;
                return `${body}\n${styleItems}\n    ${close}`;
              }
            );
            fs.writeFileSync(stylesPath, stylesXml);
          }

          // 2c. Patch strings.xml so Android app display label is MultiPlayer
          const stringsPath = 'android/app/src/main/res/values/strings.xml';
          if (fs.existsSync(stringsPath)) {
            let stringsXml = fs.readFileSync(stringsPath, 'utf8');
            stringsXml = stringsXml
              .replace(/(<string\s+name="app_name">)[^<]*(<\/string>)/g, '$1MultiPlayer$2')
              .replace(/(<string\s+name="title_activity_main">)[^<]*(<\/string>)/g, '$1MultiPlayer$2');
            fs.writeFileSync(stringsPath, stringsXml);
          }

          // 3. Patch AndroidManifest.xml: preserve 7 permissions, enforce singleTask, add OAuth deep-link, Android Auto / MediaBrowserService, MediaButtonReceiver & FileProvider
          const manifestPath = 'android/app/src/main/AndroidManifest.xml';
          let xml = fs.readFileSync(manifestPath, 'utf8');
          const perms = [
            'android.permission.WAKE_LOCK',
            'android.permission.FOREGROUND_SERVICE',
            'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK',
            'android.permission.BLUETOOTH',
            'android.permission.BLUETOOTH_CONNECT',
            'android.permission.POST_NOTIFICATIONS',
            'android.permission.REQUEST_INSTALL_PACKAGES'
          ];
          const addPerms = perms
            .filter((n) => !xml.includes('"' + n + '"'))
            .map((n) => '    <uses-permission android:name="' + n + '" />')
            .join('\n');
          if (addPerms) {
            xml = xml.replace('<application', addPerms + '\n\n    <application');
          }

          const activityOpenRe = /<activity\b[^>]*\bandroid:name="(?:\.|com\.audiobook\.player\.)MainActivity"[^>]*>/;
          if (!activityOpenRe.test(xml)) {
            throw new Error('Could not find MainActivity <activity> tag in AndroidManifest.xml');
          }
          xml = xml.replace(activityOpenRe, (tag) => {
            if (/\bandroid:launchMode=/.test(tag)) {
              return tag.replace(/\bandroid:launchMode="[^"]*"/, 'android:launchMode="singleTask"');
            }
            return tag.replace(/>$/, ' android:launchMode="singleTask">');
          });

          if (!xml.includes('android:scheme="com.audiobook.player"')) {
            const oauthFilter = [
              '            <intent-filter>',
              '                <action android:name="android.intent.action.VIEW" />',
              '                <category android:name="android.intent.category.DEFAULT" />',
              '                <category android:name="android.intent.category.BROWSABLE" />',
              '                <data android:scheme="com.audiobook.player" android:host="oauth" />',
              '            </intent-filter>'
            ].join('\n');
            const activityBlockRe = /(<activity\b[^>]*\bandroid:name="(?:\.|com\.audiobook\.player\.)MainActivity"[^>]*>[\s\S]*?)(<\/activity>)/;
            if (!activityBlockRe.test(xml)) {
              throw new Error('Could not find closing </activity> for MainActivity in AndroidManifest.xml');
            }
            xml = xml.replace(activityBlockRe, `$1${oauthFilter}\n        $2`);
          }

          if (!xml.includes('</application>')) {
            throw new Error('Could not find </application> in AndroidManifest.xml');
          }

          if (!xml.includes('com.google.android.gms.car.application')) {
            const carAppMetaXml = [
              '        <meta-data',
              '            android:name="com.google.android.gms.car.application"',
              '            android:resource="@xml/automotive_app_desc" />'
            ].join('\n');
            xml = xml.replace('</application>', `${carAppMetaXml}\n    </application>`);
          }

          if (!xml.includes('com.google.android.gms.car.notification.SmallIcon')) {
            const carIconMetaXml = [
              '        <meta-data',
              '            android:name="com.google.android.gms.car.notification.SmallIcon"',
              '            android:resource="@mipmap/ic_launcher" />'
            ].join('\n');
            xml = xml.replace('</application>', `${carIconMetaXml}\n    </application>`);
          }

          if (!xml.includes('AudiobookMediaBrowserService')) {
            const serviceXml = [
              '        <service',
              '            android:name=".AudiobookMediaBrowserService"',
              '            android:enabled="true"',
              '            android:exported="true"',
              '            android:foregroundServiceType="mediaPlayback">',
              '            <intent-filter>',
              '                <action android:name="android.media.browse.MediaBrowserService" />',
              '            </intent-filter>',
              '        </service>'
            ].join('\n');
            xml = xml.replace('</application>', `${serviceXml}\n    </application>`);
          }

          if (!xml.includes('androidx.media.session.MediaButtonReceiver')) {
            const receiverXml = [
              '        <receiver',
              '            android:name="androidx.media.session.MediaButtonReceiver"',
              '            android:exported="true">',
              '            <intent-filter>',
              '                <action android:name="android.intent.action.MEDIA_BUTTON" />',
              '            </intent-filter>',
              '        </receiver>'
            ].join('\n');
            xml = xml.replace('</application>', `${receiverXml}\n    </application>`);
          }

          if (!xml.includes('androidx.core.content.FileProvider')) {
            const providerXml = [
              '        <provider',
              '            android:name="androidx.core.content.FileProvider"',
              '            android:authorities="${applicationId}.fileprovider"',
              '            android:exported="false"',
              '            android:grantUriPermissions="true">',
              '            <meta-data',
              '                android:name="android.support.FILE_PROVIDER_PATHS"',
              '                android:resource="@xml/file_paths" />',
              '        </provider>'
            ].join('\n');
            xml = xml.replace('</application>', `${providerXml}\n    </application>`);
          }

          if (
            !xml.includes('android:launchMode="singleTask"') ||
            !xml.includes('android:scheme="com.audiobook.player"') ||
            !xml.includes('"android.permission.BLUETOOTH"') ||
            !xml.includes('"android.permission.BLUETOOTH_CONNECT"') ||
            !xml.includes('com.google.android.gms.car.application') ||
            !xml.includes('com.google.android.gms.car.notification.SmallIcon') ||
            !xml.includes('.AudiobookMediaBrowserService') ||
            !xml.includes('androidx.media.session.MediaButtonReceiver') ||
            !xml.includes('androidx.core.content.FileProvider')
          ) {
            throw new Error('AndroidManifest.xml patch verification failed');
          }
          fs.writeFileSync(manifestPath, xml);
          EOF

      - name: Build Android APK
        if: steps.changes.outputs.should_build == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks
            KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$PWD/app/release-keystore.jks" \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS"
            rm -f app/release-keystore.jks
            cd ..
            cp android/app/build/outputs/apk/release/app-release.apk Audiobook-Player.apk
          else
            ./gradlew assembleDebug
            cd ..
            cp android/app/build/outputs/apk/debug/app-debug.apk Audiobook-Player.apk
          fi

      - name: Read release metadata from version.json
        if: steps.changes.outputs.should_build == 'true'
        id: meta
        run: |
          node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync('version.json','utf8'));const notes=(v.releaseNotes||'MultiPlayer release');fs.appendFileSync(process.env.GITHUB_OUTPUT,'version='+v.version+'\nnotes<<GH_EOF\n'+notes+'\nGH_EOF\n');"

      - name: Upload APK workflow artifact
        if: steps.changes.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Audiobook-Player-apk
          path: Audiobook-Player.apk

      - name: Upload Web OTA bundle workflow artifact
        if: steps.changes.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Audiobook-Player-web-bundle
          path: web-bundle.zip

  build-windows-release:
    name: Build Windows Desktop EXE
    runs-on: windows-latest
    outputs:
      should_build: ${{ steps.changes.outputs.should_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if version.json changed
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || [ -z "${{ github.event.before }}" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif ! git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qx "version.json"; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.changes.outputs.should_build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust toolchain
        if: steps.changes.outputs.should_build == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Run unit tests
        if: steps.changes.outputs.should_build == 'true'
        shell: bash
        run: npm test

      - name: Prepare Tauri UI assets
        if: steps.changes.outputs.should_build == 'true'
        shell: bash
        run: node scripts/prepare-tauri-ui.mjs

      - name: Build Windows Tauri release binary
        if: steps.changes.outputs.should_build == 'true'
        shell: bash
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml
          cp src-tauri/target/release/audiobook-player.exe Audiobook-Player.exe

      - name: Upload EXE workflow artifact
        if: steps.changes.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Audiobook-Player-exe
          path: Audiobook-Player.exe

  publish-release:
    name: Publish Multi-Platform GitHub Release
    needs: [build-android-release, build-windows-release]
    runs-on: ubuntu-latest
    if: needs.build-android-release.outputs.should_build == 'true'
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Audiobook-Player-apk
          path: release-assets

      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: Audiobook-Player-exe
          path: release-assets

      - name: Download Web OTA bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: Audiobook-Player-web-bundle
          path: release-assets

      - name: Publish GitHub Release with APK, Web OTA Bundle, and EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-android-release.outputs.version }}
          name: MultiPlayer v${{ needs.build-android-release.outputs.version }}
          body: ${{ needs.build-android-release.outputs.notes }}
          files: |
            release-assets/Audiobook-Player.apk
            release-assets/Audiobook-Player.exe
            release-assets/web-bundle.zip
          make_latest: true
