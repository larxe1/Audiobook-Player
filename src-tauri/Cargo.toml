[package]
name = "audiobook-player"
version = "1.0.20"
description = "MultiPlayer Desktop App (Tauri 2)"
authors = ["MultiPlayer"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
